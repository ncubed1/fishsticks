name: Deploy Fishsticks to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy-main"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Detect package manager
      id: detect-package-manager
      working-directory: ./app
      run: |
        if [ -f "yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "dependency=yarn.lock" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          echo "runner=yarn" >> $GITHUB_OUTPUT
        elif [ -f "package.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "dependency=package-lock.json" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
          echo "runner=npx --no-install" >> $GITHUB_OUTPUT
        else
          echo "Unable to determine package manager"
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: ${{ steps.detect-package-manager.outputs.manager }}
        cache-dependency-path: ./app/${{ steps.detect-package-manager.outputs.dependency }}

    - name: Install dependencies for api
      run: |
        npm install
      working-directory: ./api

    - name: Install dependencies
      run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      working-directory: ./app
    - name: Build
      run: ${{ steps.detect-package-manager.outputs.runner }} npm run build
      working-directory: ./app
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
